# ============================================================
# Kubernetes Service — KR-FinBert API 노출
#
# 설계 근거:
# 1. ClusterIP 타입: 클러스터 내부 통신용 (Ingress를 통해 외부 노출).
#    NodePort/LoadBalancer는 클라우드 의존적이므로 ClusterIP + Ingress 패턴 권장.
# 2. 세션 어피니티 None: 감성 분석은 상태 비저장(stateless)이므로
#    라운드로빈 로드밸런싱이 적합.
# 3. 포트 네이밍: Istio 등 서비스 메시 호환을 위해 http- 접두어 사용.
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: kr-finbert-api
  namespace: ml-serving
  labels:
    app: kr-finbert-api
    team: ml-platform
  annotations:
    # Prometheus 서비스 디스커버리
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: kr-finbert-api
  ports:
    - name: http-api
      port: 80           # 서비스 포트 (클라이언트 접근용)
      targetPort: 8000    # Pod 컨테이너 포트
      protocol: TCP
  # 상태 비저장 서비스이므로 세션 어피니티 불필요
  sessionAffinity: None
