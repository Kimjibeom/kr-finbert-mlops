# ============================================================
# GitHub Actions CI/CD 파이프라인
#
# 트리거 조건:
# 1. main 브랜치 PR 또는 Push → 린트, 테스트, 이미지 빌드
# 2. release/* 태그 → 프로덕션 이미지 빌드 + 레지스트리 푸시 + K8s 매니페스트 업데이트
# 3. 수동 트리거 (workflow_dispatch) → 모델 업데이트 시 AI 팀이 직접 실행 가능
#
# 설계 근거:
# - 전담 운영자 없이 완전 자동화된 배포 파이프라인.
# - 이미지 태그에 git SHA를 사용하여 추적 가능성 확보.
# - K8s 매니페스트 이미지 태그 자동 업데이트 → GitOps 패턴.
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # AI 팀이 새 모델 릴리스 시 수동 트리거 가능
  workflow_dispatch:
    inputs:
      model_version:
        description: "모델 버전 태그 (예: v1.2.0)"
        required: false
        default: "latest"

env:
  # Docker 레지스트리 설정 — 실제 환경에 맞게 변경
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── 1단계: 린트 및 테스트 ──
  test:
    name: Lint & Test
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} 설정
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # 의존성 캐싱으로 CI 시간 단축 (~2분 → ~30초)
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements.txt
          pip install ruff anyio pytest-anyio

      # Ruff: flake8 + isort + pylint 대체, 10-100x 빠른 린터
      - name: Ruff 린트 검사
        run: ruff check app/ tests/

      - name: Ruff 포맷 검사
        run: ruff format --check app/ tests/

      # 테스트 실행 — 모델은 모킹되므로 다운로드 불필요
      - name: pytest 실행
        run: pytest tests/ -v --tb=short

  # ── 2단계: Docker 이미지 빌드 및 푸시 ──
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-22.04
    needs: test
    # main 브랜치 push 또는 태그 push 시에만 실행
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      packages: write

    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4

      # Docker Buildx: 멀티 플랫폼 빌드 + 레이어 캐싱 지원
      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      # GitHub Container Registry 로그인
      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 이미지 태그 생성:
      # - main 브랜치: latest + git SHA
      # - 태그: 태그 이름 + latest
      - name: 이미지 메타데이터 추출
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # 빌드 및 푸시 — 레이어 캐싱으로 재빌드 시간 최소화
      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3단계: K8s 매니페스트 이미지 태그 업데이트 ──
  update-manifests:
    name: Update K8s Manifests
    runs-on: ubuntu-22.04
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # K8s Deployment 매니페스트의 이미지 태그를 새 SHA로 업데이트
      # 이유: GitOps 패턴 — 매니페스트 변경이 곧 배포 트리거
      - name: 이미지 태그 업데이트
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | head -c 7)
          NEW_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}"
          
          echo "Updating image to: ${NEW_IMAGE}"
          
          # sed를 사용하여 deployment.yaml의 이미지 태그 업데이트
          sed -i "s|image: .*kr-finbert.*|image: ${NEW_IMAGE}|g" k8s/deployment.yaml
          
          # 변경 사항 확인
          grep "image:" k8s/deployment.yaml

      # 변경된 매니페스트를 커밋 (ArgoCD/Flux 등의 GitOps 도구가 감지)
      - name: 변경 사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add k8s/deployment.yaml
          
          # 변경 사항이 있을 때만 커밋
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update image tag to ${{ github.sha }}"
            git push
          fi
